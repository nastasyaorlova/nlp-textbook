# Настройки учебника. Подробно: https://jupyterbook.org/en/stable/customize/config.html
title: NLP в рекламе и PR
author: НИУ ВШЭ
copyright: "2026"
only_build_toc_files: true

# Тетрадки уже выполнены в Colab: при сборке их не запускаем, показываем сохранённые результаты
execute:
  execute_notebooks: "off"

# ⚠️ Замените GITHUB_USERNAME на ваш логин GitHub (и имя репозитория, если оно другое)
repository:
  url: https://github.com/GITHUB_USERNAME/nlp-textbook
  branch: main

# Кнопка «Открыть в Colab» на страницах с тетрадками
launch_buttons:
  colab_url: "https://colab.research.google.com"
  notebook_interface: classic

html:
  use_repository_button: true
  use_download_button: true
  home_page_in_navbar: true

sphinx:
  config:
    language: ru
    html_show_copyright: true
